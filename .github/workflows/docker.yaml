name: Docker Build, Test, and Publish
# Builds the container image from a published @inkeep/open-knowledge npm version.
# release.yml triggers it via repository_dispatch. GHCR auth uses GITHUB_TOKEN only.
on:
  # Build and smoke only, publish nothing.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/docker/**
      - .github/workflows/docker.yaml
  # --- BRANCH TEST HARNESS (drop before merge) ---
  push:
    branches: [docker-image]
  # Fired by release.yml after the npm publish. CI releases are published with
  # GITHUB_TOKEN, which doesn't cascade the `release` event.
  repository_dispatch:
    types: [container-build]
  # Recovery: rebuild the image for an existing release.
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to build, with or without the v prefix (e.g. v0.63.6 or 0.63.6-beta.3)"
        required: true
        type: string
      update_moving_tags:
        description: "Also move latest/X.Y (or beta) to this build. Turn off when rebuilding an old version."
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: docker-${{ github.event.pull_request.number || github.event.client_payload.version || inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE_NAME: ghcr.io/yvigara/open-knowledge
  NPM_PACKAGE: "@inkeep/open-knowledge"
  # --- BRANCH TEST HARNESS (drop before merge) ---
  # Branch runs publish under `test-` tags so they never move a real tag.
  TAG_PREFIX: ${{ github.ref == 'refs/heads/docker-image' && 'test-' || '' }}
jobs:
  # Unprivileged, safe for PR code. Resolves the version and proves the image boots.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Resolve version + tags
        id: resolve
        env:
          RAW_TAG: ${{ github.event.client_payload.version || inputs.version }}
          MOVE_TAGS: ${{ github.event_name != 'workflow_dispatch' || inputs.update_moving_tags }}
        run: |
          set -euo pipefail
          # PR and branch runs have no release: build npm `latest`.
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="$(npm view "${NPM_PACKAGE}@latest" version)"
          fi
          VERSION="${RAW_TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::'${RAW_TAG}' is not X.Y.Z or X.Y.Z-beta.N." >&2
            exit 1
          fi
          TAGS="${IMAGE_NAME}:${TAG_PREFIX}${VERSION}"
          if [ "$MOVE_TAGS" = "true" ]; then
            case "$VERSION" in
              # Betas never get `latest` or X.Y.
              *-beta.*) TAGS="${TAGS},${IMAGE_NAME}:${TAG_PREFIX}beta" ;;
              *) TAGS="${TAGS},${IMAGE_NAME}:${TAG_PREFIX}${VERSION%.*},${IMAGE_NAME}:${TAG_PREFIX}latest" ;;
            esac
          fi
          {
            echo "version=${VERSION}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${NPM_PACKAGE}@${VERSION} -> ${TAGS}"
      # npm can lag a few seconds behind the publish that dispatched this run.
      - name: Wait for the npm version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if npm view "${NPM_PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
              exit 0
            fi
            echo "Attempt ${attempt}/10: ${NPM_PACKAGE}@${VERSION} not on npm yet; retrying in 15s."
            sleep 15
          done
          echo "::error::${NPM_PACKAGE}@${VERSION} never appeared on npm." >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # The Dockerfile itself fails if the installed version doesn't match.
      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          build-args: |
            OK_VERSION=${{ steps.resolve.outputs.version }}
          load: true
          tags: ok-smoke:ci
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max
      # The server refuses a 0.0.0.0 bind without OK_ALLOW_EXTERNAL=1.
      - name: Smoke - first boot initializes and serves
        run: |
          set -euo pipefail
          trap 'docker logs ok-smoke 2>&1 | tail -n 100 || true; docker rm -f ok-smoke >/dev/null 2>&1 || true; docker volume rm -f ok-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name ok-smoke -e OK_ALLOW_EXTERNAL=1 \
            -v ok-smoke:/opt/data -p 127.0.0.1:8080:8080 ok-smoke:ci
          for attempt in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Running}}' ok-smoke)" != "true" ]; then
              echo "::error::Container exited during first boot." >&2
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              docker exec ok-smoke test -f /opt/data/.ok/config.yml
              # tini keeps ok off PID 1, which would make its own lock read as corrupt.
              STATUS="$(docker exec ok-smoke ok status 2>&1)"
              echo "$STATUS"
              if printf '%s' "$STATUS" | grep -qi corrupt; then
                echo "::error::ok status reports a corrupt lock." >&2
                exit 1
              fi
              echo "Server answered /healthz after ${attempt}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::/healthz never answered within 120s." >&2
          exit 1

  publish:
    needs: smoke
    if: >-
      github.repository == 'yvigara/open-knowledge' && (
        github.ref == 'refs/heads/docker-image' ||
        github.event_name == 'repository_dispatch' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # No Actions cache in a job that can push: a poisoned layer would ship.
    cache-mode: none
    timeout-minutes: 45
    environment: container-publish
    # id-token: write is for cosign keyless signing.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            OK_VERSION=${{ needs.smoke.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ needs.smoke.outputs.tags }}
          push: true
          sbom: true
          provenance: mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # `refs/` matches both dispatch (main) and branch runs.
      - name: Sign + verify
        env:
          REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/docker\.yaml@refs/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$REF" > /dev/null
          {
            echo "### Container image published"
            echo "- \`${REF}\`"
            echo "- Tags: \`${{ needs.smoke.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
